<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism-tomorrow.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fas fa-database text-blue-500 mr-2"></i>SQL Validator
            </h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center space-x-4">
                    <button type="submit" form="sqlForm" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                        <i class="fas fa-play mr-2"></i>Validate (F5)
                    </button>
                    <button type="button" onclick="clearForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg">
                        Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <form id="sqlForm" method="POST" class="space-y-6 max-w-4xl mx-auto">
            <!-- Query Editor -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                <div class="p-4 border-b border-gray-200">
                    <h3 class="font-semibold text-gray-700">SQL Editor</h3>
                </div>
                <div class="p-4">
                    <textarea 
                        id="sql_query"
                        name="sql_query"
                        class="w-full h-96 font-mono text-sm p-4 rounded-lg bg-gray-800 text-gray-100 focus:outline-none"
                        placeholder="Enter your SQL query here..."
                    >{{ request.form.sql_query }}</textarea>
                </div>
            </div>

            <!-- Results Section -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="font-semibold text-gray-700">Validation Result</h3>
                   
                </div>
                <div class="p-4">
                    {% if result %}
                        <div class="p-4 rounded-lg {% if '✅' in result %}bg-green-50 text-green-700{% else %}bg-red-50 text-red-700{% endif %}">
                            {{ result }}
                            
                        </div>
                    {% else %}
                        <div class="text-gray-500 text-center py-8">
                            <i class="fas fa-info-circle text-3xl mb-2"></i>
                            <p>Validation results will appear here</p>
                        </div>
                    {% endif %}
                    <!-- Add this section below the Validation Result section -->
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
    <script>
        function clearForm() {
            document.getElementById('sqlForm').reset();
            window.location.href = '/';
        }

        // Keyboard shortcut for F5
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F5') {
                e.preventDefault(); //Prevents the default behavior of the F5 key, which is to reload the page.
                document.getElementById('sqlForm').submit();
            }
        });

    </script>
</body>
</html>
